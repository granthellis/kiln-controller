      learned: "{{ (state_attr('sensor.kiln_demand_traces', 'traces') or {}).get(p) }}"
      plan: "{{ learned if learned else seed_traces.get(p, []) }}"
      measured: "{{ (state_attr('sensor.kiln_demand_trace_current', 'trace') or []) if running else [] }}"
      trace: "{{ measured + plan[measured | count:] if running else plan }}"
      fcid: >-
        {{ 'sensor.solcast_pv_forecast_forecast_'
           ~ ('today' if d == 0 else 'tomorrow' if d == 1 else 'day_' ~ (d + 1)) }}
      sol: "{{ (state_attr(fcid, 'detailedForecast') or []) | map(attribute='pv_estimate') | list }}"
      sol10: "{{ (state_attr(fcid, 'detailedForecast') or []) | map(attribute='pv_estimate10') | list }}"
      fc_ms: "{{ (state_attr(fcid, 'detailedForecast') or []) | map(attribute='period_start') | map('as_timestamp') | map('multiply', 1000) | map('int') | list }}"
      day0: "{{ fc_ms[0] / 1000 if fc_ms else (today_at('00:00') + timedelta(days=d)).timestamp() }}"
      # no start in the past: now rounded up to the next 15 min
      earliest: "{{ [day0, ((now().timestamp() + 899) / 900) | int * 900] | max }}"
      base: "{{ states('input_number.kiln_house_base_load') | float(0.8) }}"
      dur_h: "{{ (trace | count) / 4 }}"
      stats: "{{ (state_attr('sensor.kiln_profile_durations', 'durations') or {}).get(p) }}"
      n: "{{ stats.n if stats else 0 }}"
      buffer_min: >-
        {{ 60 if n == 0 else 45 if n < 3
           else [30, ((stats.max_h - stats.mean_h) * 60 + 15) | round(0)] | max }}
      we_ts: "{{ (today_at(states('input_datetime.kiln_cheap_window_end')) + timedelta(days=d)).timestamp() }}"
      latest: "{{ ((we_ts - dur_h * 3600 - buffer_min * 60) / 900) | int * 900 }}"
      feasible: "{{ latest >= earliest }}"
      # latest start that still finishes by 20:00
      last_any: "{{ ((day0 + 20 * 3600 - dur_h * 3600) / 900) | int * 900 }}"
      possible: "{{ running or last_any >= earliest }}"
      best: >-
        {% set ns = namespace(s=latest, c=-1) %}
        {% set first = [earliest, latest - 12 * 3600] | max %}
        {% for j in range(((latest - first) / 900) | int + 1) if feasible and not running %}
          {% set s = first + j * 900 %}
          {% set c = namespace(v=0) %}
          {% for kw in trace %}
            {% set i = ((s + loop.index0 * 900 - day0) / 1800) | int %}
            {% set pv = sol[i] if 0 <= i < sol | count else 0 %}
            {% set c.v = c.v + [kw, [pv - base, 0] | max] | min * 0.25 %}
          {% endfor %}
          {% if c.v > ns.c + 0.05 %}{% set ns.s = s %}{% set ns.c = c.v %}{% endif %}
        {% endfor %}
        {{ ns.s }}
      # same search with no finish deadline (must finish by 20:00): shows what
      # the deadline costs in solar share
      best_any: >-
        {% set ns = namespace(s=last_any, c=-1) %}
        {% set first = [earliest, last_any - 14 * 3600] | max %}
        {% for j in range(((last_any - first) / 900) | int + 1) if possible and not running %}
          {% set s = first + j * 900 %}
          {% set c = namespace(v=0) %}
          {% for kw in trace %}
            {% set i = ((s + loop.index0 * 900 - day0) / 1800) | int %}
            {% set pv = sol[i] if 0 <= i < sol | count else 0 %}
            {% set c.v = c.v + [kw, [pv - base, 0] | max] | min * 0.25 %}
          {% endfor %}
          {% if c.v > ns.c + 0.05 %}{% set ns.s = s %}{% set ns.c = c.v %}{% endif %}
        {% endfor %}
        {{ [ns.s, ns.c | round(1)] }}
      start: "{{ run_started if running else best if feasible else best_any[0] }}"
      cover: >-
        {% set c = namespace(p50=0, p10=0, tot=0) %}
        {% for kw in trace %}
          {% set i = ((start + loop.index0 * 900 - day0) / 1800) | int %}
          {% set ok = 0 <= i < sol | count %}
          {% set c.p50 = c.p50 + [kw, [(sol[i] if ok else 0) - base, 0] | max] | min * 0.25 %}
          {% set c.p10 = c.p10 + [kw, [(sol10[i] if ok else 0) - base, 0] | max] | min * 0.25 %}
          {% set c.tot = c.tot + kw * 0.25 %}
        {% endfor %}
        {{ {'p50': c.p50 | round(1), 'p10': c.p10 | round(1), 'tot': c.tot | round(1)} }}
    sensor:
      - name: "Kiln recommended start"
        unique_id: kiln_recommended_start
        icon: mdi:clock-start
        state: >-
          {{ none if not trace else 'firing' if running else 'too late today' if not possible
             else start | timestamp_custom('%H:%M') }}
        attributes:
          profile: "{{ p }}"
          firing_day: "{{ day0 | timestamp_custom('%a %d %b') }}"
          days_ahead: "{{ d }}"
          mode: "{{ 'active firing' if running else 'recommendation' }}"
          started: "{{ run_started | timestamp_custom('%H:%M') if running else none }}"
          forecast_entity: "{{ fcid }}"
          forecast_available: "{{ sol | count > 0 }}"
          timezone: "Australia/Sydney"
          # epoch of the recommended start; the apply script only arms autostart
          # when this is within the next 24 h (autostart fires at the next
          # occurrence of the clock time)
          start_ts: "{{ start | int if trace and possible else 0 }}"
          deadline_met: "{{ start + dur_h * 3600 <= we_ts if running else feasible }}"
          duration_h: "{{ dur_h }}"
          est_finish: "{{ (start + dur_h * 3600) | timestamp_custom('%H:%M') if trace and possible else none }}"
          latest_start: "{{ latest | timestamp_custom('%H:%M') }}"
          buffer_min: "{{ buffer_min }}"
          runs_learned: "{{ n }}"
          demand_source: >-
            {% set src = 'last firing' if learned else 'measured 18 Sep 2026'
               if p == 'cone 6 - Tony Hansen drop soak FAST' else 'simulated' if plan else 'unknown profile' %}
            {{ 'measured so far, then ' ~ src if running else 'learned (last firing)' if learned else src }}
          kiln_kwh: "{{ cover.tot }}"
          solar_kwh: "{{ cover.p50 }}"
          solar_kwh_cloudy_p10: "{{ cover.p10 }}"
          solar_share_pct: "{{ (cover.p50 / cover.tot * 100) | round(0) if cover.tot > 0 else 0 }}"
          solar_share_cloudy_pct: "{{ (cover.p10 / cover.tot * 100) | round(0) if cover.tot > 0 else 0 }}"
          solar_optimal_start_no_deadline: "{{ best_any[0] | timestamp_custom('%H:%M') if trace and possible and not running else none }}"
          solar_optimal_finish_no_deadline: "{{ (best_any[0] + dur_h * 3600) | timestamp_custom('%H:%M') if trace and possible and not running else none }}"
          solar_share_no_deadline_pct: "{{ (best_any[1] / cover.tot * 100) | round(0) if cover.tot > 0 and not running else none }}"
          house_base_kw: "{{ base }}"
          # chart series, [epoch ms, kW] every 30 min (solar) / 15 min (kiln)
          chart_solar: "{{ zip(fc_ms, sol) | map('list') | list }}"
          chart_solar_p10: "{{ zip(fc_ms, sol10) | map('list') | list }}"
          # house base load + kiln, 05:00-20:00 on the firing day
          chart_demand: >-
            {% set out = namespace(v=[]) %}
            {% for j in range(20, 81) %}
              {% set t = day0 + j * 900 %}
              {% set i = ((t - start) / 900) | int %}
              {% set kw = trace[i] if possible and t >= start and i < trace | count else 0 %}
              {% set out.v = out.v + [[(t * 1000) | int, (kw + base) | round(2)]] %}
            {% endfor %}
            {{ out.v }}
          # active firing only: measured kiln + house base, stepped per 15-min
          # slot from the real start, then the current partial slot up to now
          chart_measured: >-
            {% set out = namespace(v=[]) %}
            {% if running %}
              {% for kw in measured %}
                {% set out.v = out.v + [[((start + loop.index0 * 900) * 1000) | int, (kw + base) | round(2)]] %}
              {% endfor %}
              {% set a = states.sensor.kiln_demand_trace_current.attributes %}
              {% set lt = a.get('last_t', start) | float(start) %}
              {% set nt = now().timestamp() %}
              {% if nt > lt + 60 %}
                {% set kw = [(states('sensor.kiln_energy_energy_a') | float(0) - a.get('last_e', 0) | float(0)) * 3600 / (nt - lt), 0] | max %}
                {% set t0 = start + (measured | count) * 900 %}
                {% set out.v = out.v + [[(t0 * 1000) | int, (kw + base) | round(2)], [(nt * 1000) | int, (kw + base) | round(2)]] %}
              {% endif %}
            {% endif %}
            {{ out.v }}

  - sensor:
      - name: "Kiln element health"
        unique_id: kiln_element_health
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:heart-pulse
        # heating power vs new at the same voltage = R_baseline / R_last
        state: >-
          {% set b = states('input_number.kiln_element_r_baseline') | float(0) %}
          {% set l = states('input_number.kiln_element_r_last') | float(0) %}
          {{ (b / l * 100) | round(1) if b > 0 and l > 0 else none }}
      - name: "Kiln element health status"
        unique_id: kiln_element_health_status
        icon: mdi:heart-pulse
        state: >-
          {% set h = states('sensor.kiln_element_health') | float(0) %}
          {% if h <= 0 %}unknown{% elif h >= 92 %}normal
          {% elif h >= 85 %}slowing: top of cone 10 may lag
          {% else %}cone 10 unreliable: plan replacement{% endif %}
      - name: "Kiln element current at 240V"
        unique_id: kiln_element_current_at_240v
        unit_of_measurement: "A"
        state_class: measurement
        icon: mdi:current-ac
        state: >-
          {% set l = states('input_number.kiln_element_r_last') | float(0) %}
          {{ (240 / l) | round(2) if l > 0 else none }}
      - name: "Kiln element energy"
        unique_id: kiln_element_energy
        unit_of_measurement: "kWh"
        state_class: total_increasing
        icon: mdi:lightning-bolt
        state: >-
          {{ (states('sensor.kiln_energy_energy_a') | float(0)
              - states('input_number.kiln_element_energy_at_change') | float(0)) | round(2) }}

