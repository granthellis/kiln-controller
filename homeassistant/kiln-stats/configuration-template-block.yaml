  # ── Kiln stats: element health, learned durations, solar start (2026-09-18) ──
  # Written with Claude; plan-of-record in granthellis/kiln-controller docs/.
  # Element resistance R = V/I from the PJ-1203A while the elements are fully
  # on. A sample only counts when current is within 10% of full-on (V / last R)
  # and PF >= 95, so the meter's partial-duty averages are skipped. R is flat
  # against temperature and load, so R_baseline / R_last is heating power
  # relative to new. kiln_run_tracker resets it at run start and copies the
  # mean into input_number.kiln_element_r_last at run end.
  - triggers:
      - trigger: state
        entity_id: sensor.kiln_energy_current_a
      - trigger: event
        event_type: kiln_resistance_reset
    variables:
      reset: "{{ trigger.platform == 'event' }}"
      v: "{{ states('sensor.kiln_energy_voltage') | float(0) }}"
      i: "{{ states('sensor.kiln_energy_current_a') | float(0) }}"
      pf: "{{ states('sensor.kiln_energy_power_factor_a') | float(0) }}"
      rl: "{{ states('input_number.kiln_element_r_last') | float(0) or 11.243 }}"
      ok: "{{ not reset and is_state('sensor.kiln_state', 'RUNNING') and v > 180 and i >= 0.9 * v / rl and pf >= 95 }}"
      r: "{{ v / i if ok else 0 }}"
    sensor:
      - name: "Kiln element resistance run"
        unique_id: kiln_element_resistance_run
        unit_of_measurement: "Ω"
        state_class: measurement
        icon: mdi:omega
        # `this` is only defined in entity templates, not trigger variables
        state: >-
          {% set n = (0 if reset else this.attributes.get('n', 0) | int(0)) + (1 if r > 0 else 0) %}
          {% set s = (0 if reset else this.attributes.get('sum', 0) | float(0)) + r %}
          {{ (s / n) | round(3) if n > 0 else none }}
        attributes:
          n: "{{ (0 if reset else this.attributes.get('n', 0) | int(0)) + (1 if r > 0 else 0) }}"
          sum: "{{ ((0 if reset else this.attributes.get('sum', 0) | float(0)) + r) | round(3) }}"

  # Learned firing duration per profile (RUNNING -> IDLE wall time, catch-up
  # included), fed by the kiln_firing_completed event from kiln_run_tracker.
  - triggers:
      - trigger: event
        event_type: kiln_firing_completed
    variables:
      p: "{{ trigger.event.data.get('profile', '') }}"
      h: "{{ trigger.event.data.get('duration_h', 0) | float(0) }}"
      ok: "{{ trigger.event.data.get('completed', false) | string | lower == 'true' and p != '' and h > 0.5 }}"
    sensor:
      - name: "Kiln profile durations"
        unique_id: kiln_profile_durations
        icon: mdi:timer-cog
        # state = completed firings learned; per-profile stats in `durations`
        state: "{{ this.state | int(0) + (1 if ok else 0) }}"
        attributes:
          durations: >-
            {%- set old = this.attributes.get('durations', {}) -%}
            {%- if ok -%}
            {%- set e = old.get(p, {'n': 0, 'mean_h': 0, 'max_h': 0}) -%}
            {%- set new = {'n': e.n + 1, 'mean_h': ((e.mean_h * e.n + h) / (e.n + 1)) | round(3),
                          'max_h': [e.max_h, h] | max | round(3), 'last_h': h | round(3)} -%}
            {{ dict((old.items() | list) + [(p, new)]) }}
            {%- else -%}{{ old }}{%- endif -%}

  # Kiln demand learning: kW per 15 min from run start (energy-meter deltas),
  # reset at run start by kiln_run_tracker's kiln_resistance_reset event.
  # On a completed firing the trace is stored per profile in
  # sensor.kiln_demand_traces and replaces that profile's seed curve.
  - triggers:
      - trigger: time_pattern
        minutes: /1
      - trigger: event
        event_type: kiln_resistance_reset
    variables:
      reset: "{{ trigger.platform == 'event' }}"
      e: "{{ states('sensor.kiln_energy_energy_a') | float(0) }}"
      now_ts: "{{ now().timestamp() }}"
      started: "{{ states('input_number.kiln_run_started_ts') | float(0) }}"
      running: "{{ is_state('sensor.kiln_state', 'RUNNING') and started > 0 }}"
    sensor:
      - name: "Kiln demand trace current"
        unique_id: kiln_demand_trace_current
        icon: mdi:chart-bell-curve
        state: "{{ 'recording' if running else 'idle' }}"
        attributes:
          trace: >-
            {%- set tr = [] if reset else this.attributes.get('trace', []) -%}
            {%- set le = e if reset else this.attributes.get('last_e', e) | float(e) -%}
            {%- set lt = now_ts if reset else this.attributes.get('last_t', now_ts) | float(now_ts) -%}
            {%- if not reset and running and ((now_ts - started) / 900) | int > tr | count and now_ts > lt + 60 -%}
            {{ tr + [([(e - le) * 3600 / (now_ts - lt), 0] | max) | round(2)] }}
            {%- else -%}{{ tr }}{%- endif -%}
          last_e: >-
            {%- set tr = [] if reset else this.attributes.get('trace', []) -%}
            {%- set lt = now_ts if reset else this.attributes.get('last_t', now_ts) | float(now_ts) -%}
            {%- if reset or (running and ((now_ts - started) / 900) | int > tr | count and now_ts > lt + 60) -%}{{ e }}
            {%- else -%}{{ this.attributes.get('last_e', e) }}{%- endif -%}
          last_t: >-
            {%- set tr = [] if reset else this.attributes.get('trace', []) -%}
            {%- set lt = now_ts if reset else this.attributes.get('last_t', now_ts) | float(now_ts) -%}
            {%- if reset or (running and ((now_ts - started) / 900) | int > tr | count and now_ts > lt + 60) -%}{{ now_ts }}
            {%- else -%}{{ this.attributes.get('last_t', now_ts) }}{%- endif -%}

  - triggers:
      - trigger: event
        event_type: kiln_firing_completed
    variables:
      p: "{{ trigger.event.data.get('profile', '') }}"
      ok: "{{ trigger.event.data.get('completed', false) | string | lower == 'true' and p != '' }}"
      tr: "{{ state_attr('sensor.kiln_demand_trace_current', 'trace') or [] }}"
    sensor:
      - name: "Kiln demand traces"
        unique_id: kiln_demand_traces
        icon: mdi:chart-multiple
        state: "{{ p if ok and tr | count >= 8 else this.state }}"
        attributes:
          traces: >-
            {%- set old = this.attributes.get('traces', {}) -%}
            {%- if ok and tr | count >= 8 -%}{{ dict((old.items() | list) + [(p, tr)]) }}
            {%- else -%}{{ old }}{%- endif -%}

  # Recommended autostart (solar-matched). Slides the profile's 15-min kiln
  # demand curve across tomorrow's Solcast forecast and picks the start that puts the most kiln kWh
  # under solar minus house base load, subject to finishing by
  # kiln_cheap_window_end minus the buffer. Earliest start wins near-ties.
  # Demand curve: the last completed firing of the profile (learned from the
  # meter by sensor.kiln_demand_trace_current), else a seed: measured
  # 18 Sep 2026 for cone 6 FAST, the rest simulated from a heat-balance model
  # fitted to that firing (docs/new-elements-2026-09.md in kiln-controller).
  # buffer: 60 min before any run of the profile, 45 min for n=1-2,
  # max(30, spread + 15) for n>=3.
  - triggers:
      - trigger: state
        entity_id:
          - input_select.kiln_switch_schedule
          - input_datetime.kiln_cheap_window_end
          - input_number.kiln_house_base_load
          - sensor.kiln_profile_durations
          - sensor.kiln_demand_traces
          - sensor.solcast_pv_forecast_forecast_today
          - sensor.solcast_pv_forecast_forecast_tomorrow
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        minutes: 1
