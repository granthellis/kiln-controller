  # ── Kiln stats: element health, learned durations, solar start (2026-09-18) ──
  # Written with Claude; plan-of-record in granthellis/kiln-controller docs/.
  # Element resistance R = V/I from the PJ-1203A while the elements are fully
  # on. A sample only counts when current is within 10% of full-on (V / last R)
  # and PF >= 95, so the meter's partial-duty averages are skipped. R is flat
  # against temperature and load, so R_baseline / R_last is heating power
  # relative to new. kiln_run_tracker resets it at run start and copies the
  # mean into input_number.kiln_element_r_last at run end.
  - triggers:
      - trigger: state
        entity_id: sensor.kiln_energy_current_a
      - trigger: event
        event_type: kiln_resistance_reset
    variables:
      reset: "{{ trigger.platform == 'event' }}"
      v: "{{ states('sensor.kiln_energy_voltage') | float(0) }}"
      i: "{{ states('sensor.kiln_energy_current_a') | float(0) }}"
      pf: "{{ states('sensor.kiln_energy_power_factor_a') | float(0) }}"
      rl: "{{ states('input_number.kiln_element_r_last') | float(0) or 11.243 }}"
      ok: "{{ not reset and is_state('sensor.kiln_state', 'RUNNING') and v > 180 and i >= 0.9 * v / rl and pf >= 95 }}"
      r: "{{ v / i if ok else 0 }}"
    sensor:
      - name: "Kiln element resistance run"
        unique_id: kiln_element_resistance_run
        unit_of_measurement: "Ω"
        state_class: measurement
        icon: mdi:omega
        # `this` is only defined in entity templates, not trigger variables
        state: >-
          {% set n = (0 if reset else this.attributes.get('n', 0) | int(0)) + (1 if r > 0 else 0) %}
          {% set s = (0 if reset else this.attributes.get('sum', 0) | float(0)) + r %}
          {{ (s / n) | round(3) if n > 0 else none }}
        attributes:
          n: "{{ (0 if reset else this.attributes.get('n', 0) | int(0)) + (1 if r > 0 else 0) }}"
          sum: "{{ ((0 if reset else this.attributes.get('sum', 0) | float(0)) + r) | round(3) }}"

  # Learned firing duration per profile (RUNNING -> IDLE wall time, catch-up
  # included), fed by the kiln_firing_completed event from kiln_run_tracker.
  - triggers:
      - trigger: event
        event_type: kiln_firing_completed
    variables:
      p: "{{ trigger.event.data.get('profile', '') }}"
      h: "{{ trigger.event.data.get('duration_h', 0) | float(0) }}"
      ok: "{{ trigger.event.data.get('completed', false) | string | lower == 'true' and p != '' and h > 0.5 }}"
    sensor:
      - name: "Kiln profile durations"
        unique_id: kiln_profile_durations
        icon: mdi:timer-cog
        # state = completed firings learned; per-profile stats in `durations`
        state: "{{ this.state | int(0) + (1 if ok else 0) }}"
        attributes:
          durations: >-
            {%- set old = this.attributes.get('durations', {}) -%}
            {%- if ok -%}
            {%- set e = old.get(p, {'n': 0, 'mean_h': 0, 'max_h': 0}) -%}
            {%- set new = {'n': e.n + 1, 'mean_h': ((e.mean_h * e.n + h) / (e.n + 1)) | round(3),
                          'max_h': [e.max_h, h] | max | round(3), 'last_h': h | round(3)} -%}
            {{ dict((old.items() | list) + [(p, new)]) }}
            {%- else -%}{{ old }}{%- endif -%}

  # Kiln demand learning: kW per 15 min from run start (energy-meter deltas),
  # reset at run start by kiln_run_tracker's kiln_resistance_reset event.
  # On a completed firing the trace is stored per profile in
  # sensor.kiln_demand_traces and replaces that profile's seed curve.
  - triggers:
      - trigger: time_pattern
        minutes: /1
      - trigger: event
        event_type: kiln_resistance_reset
    variables:
      reset: "{{ trigger.platform == 'event' }}"
      e: "{{ states('sensor.kiln_energy_energy_a') | float(0) }}"
      now_ts: "{{ now().timestamp() }}"
      started: "{{ states('input_number.kiln_run_started_ts') | float(0) }}"
      running: "{{ is_state('sensor.kiln_state', 'RUNNING') and started > 0 }}"
    sensor:
      - name: "Kiln demand trace current"
        unique_id: kiln_demand_trace_current
        icon: mdi:chart-bell-curve
        state: "{{ 'recording' if running else 'idle' }}"
        attributes:
          trace: >-
            {%- set tr = [] if reset else this.attributes.get('trace', []) -%}
            {%- set le = e if reset else this.attributes.get('last_e', e) | float(e) -%}
            {%- set lt = now_ts if reset else this.attributes.get('last_t', now_ts) | float(now_ts) -%}
            {%- if not reset and running and ((now_ts - started) / 900) | int > tr | count and now_ts > lt + 60 -%}
            {{ tr + [([(e - le) * 3600 / (now_ts - lt), 0] | max) | round(2)] }}
            {%- else -%}{{ tr }}{%- endif -%}
          last_e: >-
            {%- set tr = [] if reset else this.attributes.get('trace', []) -%}
            {%- set lt = now_ts if reset else this.attributes.get('last_t', now_ts) | float(now_ts) -%}
            {%- if reset or (running and ((now_ts - started) / 900) | int > tr | count and now_ts > lt + 60) -%}{{ e }}
            {%- else -%}{{ this.attributes.get('last_e', e) }}{%- endif -%}
          last_t: >-
            {%- set tr = [] if reset else this.attributes.get('trace', []) -%}
            {%- set lt = now_ts if reset else this.attributes.get('last_t', now_ts) | float(now_ts) -%}
            {%- if reset or (running and ((now_ts - started) / 900) | int > tr | count and now_ts > lt + 60) -%}{{ now_ts }}
            {%- else -%}{{ this.attributes.get('last_t', now_ts) }}{%- endif -%}

  - triggers:
      - trigger: event
        event_type: kiln_firing_completed
    variables:
      p: "{{ trigger.event.data.get('profile', '') }}"
      ok: "{{ trigger.event.data.get('completed', false) | string | lower == 'true' and p != '' }}"
      tr: "{{ state_attr('sensor.kiln_demand_trace_current', 'trace') or [] }}"
    sensor:
      - name: "Kiln demand traces"
        unique_id: kiln_demand_traces
        icon: mdi:chart-multiple
        state: "{{ p if ok and tr | count >= 8 else this.state }}"
        attributes:
          traces: >-
            {%- set old = this.attributes.get('traces', {}) -%}
            {%- if ok and tr | count >= 8 -%}{{ dict((old.items() | list) + [(p, tr)]) }}
            {%- else -%}{{ old }}{%- endif -%}

  # ── Kiln firing cost (2026-09-19) ──
  # Energy cost of the current/last run. Each tick of the kiln's kWh counter
  # is charged at the marginal rate for that moment: the kiln's kW is taken
  # from grid import first (Amber general price), then battery discharge
  # (input_number.battery_charge_cost, the weighted cost of what's stored),
  # then solar (the feed-in it would have earned, floored at 0: exporting at a
  # negative price is usually curtailed, so solar is never a credit).
  # Signs: grid + = import, battery + = charging. Reset at run start by the
  # kiln_resistance_reset event (kiln_run_tracker). kiln_cost_adjust adds
  # {kwh, grid_kwh, grid_cost, battery_kwh, battery_cost, solar_kwh,
  # solar_cost} (backfill from history).
  - triggers:
      - trigger: state
        entity_id: sensor.kiln_energy_energy_a
      - trigger: event
        event_type: kiln_resistance_reset
      - trigger: event
        event_type: kiln_cost_adjust
    variables:
      ev: "{{ trigger.event.event_type if trigger.platform == 'event' else '' }}"
      reset: "{{ ev == 'kiln_resistance_reset' }}"
      adj: "{{ trigger.event.data if ev == 'kiln_cost_adjust' else {} }}"
      # delta against the last counter reading this sensor saw (not from_state),
      # so kWh used while the meter was unavailable are still charged
      e_now: "{{ states('sensor.kiln_energy_energy_a') | float(-1) }}"
      e_last: "{{ state_attr('sensor.kiln_run_energy_cost', 'e_last') | float(-1) }}"
      de: >-
        {{ (e_now - e_last) if not reset and is_state('sensor.kiln_state', 'RUNNING')
           and e_last >= 0 and e_now >= e_last and e_now - e_last < 10 else 0 }}
      k: "{{ states('sensor.kiln_energy_power_a') | float(0) / 1000 }}"
      # the meter's power can read 0 between element pulses; price that tick
      # as ~1 kW so it's split across sources instead of all going to solar
      kk: "{{ k if k > 0.1 else 1.0 }}"
      g: "{{ [states('sensor.elektrobank_14_grid_power') | float(0) / 1000, 0] | max }}"
      b: "{{ [0 - states('sensor.elektrobank_14_battery_power') | float(0) / 1000, 0] | max }}"
      f_grid: "{{ [kk, g] | min / kk }}"
      f_batt: "{{ [kk - [kk, g] | min, b] | min / kk }}"
      f_solar: "{{ 1 - f_grid - f_batt }}"
      p_imp: "{{ states('sensor.home_general_price') | float(0) }}"
      p_bat: "{{ states('input_number.battery_charge_cost') | float(0) }}"
      p_fi: "{{ [states('sensor.home_feed_in_price') | float(0), 0] | max }}"
      inc: >-
        {{ {'kwh': de + adj.get('kwh', 0) | float(0),
            'grid_kwh': de * f_grid + adj.get('grid_kwh', 0) | float(0),
            'grid_cost': de * f_grid * p_imp + adj.get('grid_cost', 0) | float(0),
            'battery_kwh': de * f_batt + adj.get('battery_kwh', 0) | float(0),
            'battery_cost': de * f_batt * p_bat + adj.get('battery_cost', 0) | float(0),
            'solar_kwh': de * f_solar + adj.get('solar_kwh', 0) | float(0),
            'solar_cost': de * f_solar * p_fi + adj.get('solar_cost', 0) | float(0)} }}
    sensor:
      - name: "Kiln run energy cost"
        unique_id: kiln_run_energy_cost
        unit_of_measurement: "$"
        device_class: monetary
        icon: mdi:cash-clock
        # `this` is only defined in entity templates, not trigger variables
        state: >-
          {% set a = {} if reset else this.attributes %}
          {{ ((a.get('grid_cost', 0) | float(0) + inc.grid_cost) + (a.get('battery_cost', 0) | float(0) + inc.battery_cost)
              + (a.get('solar_cost', 0) | float(0) + inc.solar_cost)) | round(2) }}
        attributes:
          e_last: "{{ e_now if e_now >= 0 else e_last }}"
          kwh: "{{ ((0 if reset else this.attributes.get('kwh', 0) | float(0)) + inc.kwh) | round(3) }}"
          grid_kwh: "{{ ((0 if reset else this.attributes.get('grid_kwh', 0) | float(0)) + inc.grid_kwh) | round(3) }}"
          grid_cost: "{{ ((0 if reset else this.attributes.get('grid_cost', 0) | float(0)) + inc.grid_cost) | round(4) }}"
          battery_kwh: "{{ ((0 if reset else this.attributes.get('battery_kwh', 0) | float(0)) + inc.battery_kwh) | round(3) }}"
          battery_cost: "{{ ((0 if reset else this.attributes.get('battery_cost', 0) | float(0)) + inc.battery_cost) | round(4) }}"
          solar_kwh: "{{ ((0 if reset else this.attributes.get('solar_kwh', 0) | float(0)) + inc.solar_kwh) | round(3) }}"
          solar_cost: "{{ ((0 if reset else this.attributes.get('solar_cost', 0) | float(0)) + inc.solar_cost) | round(4) }}"

  # Cost ledger, fed by kiln_firing_completed (kiln_run_tracker, which adds
  # energy/wear cost at run end) and kiln_cost_backfill (same fields, for
  # firings before the cost meter existed). State = lifetime $ (energy + wear)
  # of every run costed. kiln_cost_elementset_reset zeroes the element-set
  # totals (fire it when elements are replaced).
  - triggers:
      - trigger: event
        event_type: kiln_firing_completed
      - trigger: event
        event_type: kiln_cost_backfill
      - trigger: event
        event_type: kiln_cost_elementset_reset
    variables:
      ev: "{{ trigger.event.event_type }}"
      dd: "{{ trigger.event.data }}"
      ok: "{{ ev != 'kiln_cost_elementset_reset' and dd.get('kwh', 0) | float(0) > 0.2 }}"
      en: "{{ dd.get('energy_cost', 0) | float(0) if ok else 0 }}"
      we: "{{ dd.get('wear_cost', 0) | float(0) if ok else 0 }}"
      p: "{{ dd.get('profile', '') }}"
      run: >-
        {{ {'date': dd.get('date') or now().strftime('%Y-%m-%d'), 'profile': p,
            'completed': dd.get('completed', '') | string | lower == 'true',
            'kwh': dd.get('kwh', 0) | float(0) | round(1), 'hot_h': dd.get('hot_h', 0) | float(0) | round(2),
            'energy_cost': en | round(2), 'wear_cost': we | round(2), 'total_cost': (en + we) | round(2),
            'grid_kwh': dd.get('grid_kwh', 0) | float(0) | round(1),
            'battery_kwh': dd.get('battery_kwh', 0) | float(0) | round(1),
            'solar_kwh': dd.get('solar_kwh', 0) | float(0) | round(1)} }}
    sensor:
      - name: "Kiln firing costs"
        unique_id: kiln_firing_costs
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        icon: mdi:cash-multiple
        state: "{{ (this.state | float(0) + en + we) | round(2) }}"
        attributes:
          runs: "{{ this.attributes.get('runs', 0) | int(0) + (1 if ok else 0) }}"
          lifetime_energy: "{{ (this.attributes.get('lifetime_energy', 0) | float(0) + en) | round(2) }}"
          lifetime_wear: "{{ (this.attributes.get('lifetime_wear', 0) | float(0) + we) | round(2) }}"
          elementset_energy: >-
            {{ 0 if ev == 'kiln_cost_elementset_reset'
               else (this.attributes.get('elementset_energy', 0) | float(0) + en) | round(2) }}
          elementset_wear: >-
            {{ 0 if ev == 'kiln_cost_elementset_reset'
               else (this.attributes.get('elementset_wear', 0) | float(0) + we) | round(2) }}
          last_run: "{{ run if ok else this.attributes.get('last_run') }}"
          # newest first, 20 kept
          recent: "{{ (([run] if ok else []) + (this.attributes.get('recent') or []))[:20] }}"
          # completed runs only, so an aborted firing doesn't drag the average
          by_profile: >-
            {%- set old = this.attributes.get('by_profile') or {} -%}
            {%- if ok and run.completed and p -%}
            {%- set e = old.get(p, {'n': 0, 'mean_total': 0, 'mean_energy': 0, 'mean_wear': 0}) -%}
            {%- set new = {'n': e.n + 1,
                  'mean_total': ((e.mean_total * e.n + en + we) / (e.n + 1)) | round(2),
                  'mean_energy': ((e.mean_energy * e.n + en) / (e.n + 1)) | round(2),
                  'mean_wear': ((e.mean_wear * e.n + we) / (e.n + 1)) | round(2),
                  'last_total': (en + we) | round(2)} -%}
            {{ dict((old.items() | list) + [(p, new)]) }}
            {%- else -%}{{ old }}{%- endif -%}

  - sensor:
      # Energy so far plus wear so far (hot hours this run, including the
      # current stretch above 1000 °C) for the current/last run.
      - name: "Kiln run cost"
        unique_id: kiln_run_cost
        unit_of_measurement: "$"
        device_class: monetary
        icon: mdi:cash-fast
        state: >-
          {% set since = states('input_number.kiln_hot_since_ts') | float(0) %}
          {% set hot = states('input_number.kiln_element_hot_hours') | float(0)
                       - states('input_number.kiln_run_hot_hours_start') | float(0)
                       + ((now().timestamp() - since) / 3600 if since > 0 else 0) %}
          {% set rate = states('input_number.kiln_element_set_price') | float(0)
                        / ([states('input_number.kiln_element_life_hot_hours') | float(500), 1] | max) %}
          {{ (states('sensor.kiln_run_energy_cost') | float(0) + [hot, 0] | max * rate) | round(2) }}
        attributes:
          hot_h: >-
            {% set since = states('input_number.kiln_hot_since_ts') | float(0) %}
            {{ ([states('input_number.kiln_element_hot_hours') | float(0)
                 - states('input_number.kiln_run_hot_hours_start') | float(0)
                 + ((now().timestamp() - since) / 3600 if since > 0 else 0), 0] | max) | round(2) }}
          wear_rate_per_hot_h: >-
            {{ (states('input_number.kiln_element_set_price') | float(0)
                / ([states('input_number.kiln_element_life_hot_hours') | float(500), 1] | max)) | round(2) }}
          energy_cost: "{{ states('sensor.kiln_run_energy_cost') | float(0) }}"
      # Cross-check on the wear rate: the share of the set's life used,
      # measured from resistance. Power ∝ 1/R, so the set is spent at
      # R = R_baseline / retire health.
      - name: "Kiln element value used"
        unique_id: kiln_element_value_used
        unit_of_measurement: "$"
        device_class: monetary
        icon: mdi:cash-minus
        state: >-
          {% set b = states('input_number.kiln_element_r_baseline') | float(0) %}
          {% set l = states('input_number.kiln_element_r_last') | float(0) %}
          {% set r = states('input_number.kiln_element_retire_health') | float(72) / 100 %}
          {% set f = ([[(l / b - 1) / (1 / r - 1), 0] | max, 1] | min) if b > 0 and l > 0 and r < 1 else 0 %}
          {{ (f * states('input_number.kiln_element_set_price') | float(0)) | round(2) }}
        attributes:
          life_used_pct: >-
            {% set b = states('input_number.kiln_element_r_baseline') | float(0) %}
            {% set l = states('input_number.kiln_element_r_last') | float(0) %}
            {% set r = states('input_number.kiln_element_retire_health') | float(72) / 100 %}
            {{ ([[(l / b - 1) / (1 / r - 1), 0] | max, 1] | min * 100) | round(1) if b > 0 and l > 0 and r < 1 else 0 }}
          # hot hours at which the measured wear rate would spend the set;
          # only meaningful once a few % of life has been used
          implied_life_hot_h: >-
            {% set b = states('input_number.kiln_element_r_baseline') | float(0) %}
            {% set l = states('input_number.kiln_element_r_last') | float(0) %}
            {% set r = states('input_number.kiln_element_retire_health') | float(72) / 100 %}
            {% set f = (l / b - 1) / (1 / r - 1) if b > 0 and l > 0 and r < 1 else 0 %}
            {{ (states('input_number.kiln_element_hot_hours') | float(0) / f) | round(0) if f >= 0.03 else none }}

  # Recommended autostart (solar-matched). Slides the profile's 15-min kiln
  # demand curve across the Solcast forecast for input_select.kiln_firing_day
  # (today .. +6 days) and picks the start that puts the most kiln kWh under
  # solar minus house base load, subject to finishing by kiln_cheap_window_end
  # minus the buffer. Earliest start wins near-ties. For today, no start before
  # now; if the deadline can no longer be met it falls back to the best start
  # that finishes by 20:00 (deadline_met: false).
  # Active firing (Today + kiln RUNNING): no search. Uses the running profile
  # and its real start; the demand curve is the meter's measured 15-min slots
  # so far followed by the rest of the profile's curve (chart_measured has the
  # measured part, including the current partial slot, for the dashboard).
  # Demand curve: the last completed firing of the profile (learned from the
  # meter by sensor.kiln_demand_trace_current), else a seed: measured
  # 18 Sep 2026 for cone 6 FAST, the rest simulated from a heat-balance model
  # fitted to that firing (docs/new-elements-2026-09.md in kiln-controller).
  # buffer: 60 min before any run of the profile, 45 min for n=1-2,
  # max(30, spread + 15) for n>=3.
  - triggers:
      - trigger: state
        entity_id:
          - input_select.kiln_switch_schedule
          - input_select.kiln_firing_day
          - input_datetime.kiln_cheap_window_end
          - input_number.kiln_house_base_load
          - sensor.kiln_state
          - input_number.kiln_run_started_ts
          - sensor.kiln_demand_trace_current
          - sensor.kiln_profile_durations
          - sensor.kiln_demand_traces
          - sensor.solcast_pv_forecast_forecast_today
          - sensor.solcast_pv_forecast_forecast_tomorrow
          - sensor.solcast_pv_forecast_forecast_day_3
          - sensor.solcast_pv_forecast_forecast_day_4
          - sensor.solcast_pv_forecast_forecast_day_5
          - sensor.solcast_pv_forecast_forecast_day_6
          - sensor.solcast_pv_forecast_forecast_day_7
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      # keeps "today" from recommending a start in the past, and rolls the day over
      - trigger: time_pattern
        minutes: "/5"
    variables:
      # days from today: Today=0, Tomorrow=1, In N days=N (Solcast has 7 days)
      d: >-
        {{ {'Today': 0, 'Tomorrow': 1, 'In 2 days': 2, 'In 3 days': 3, 'In 4 days': 4,
            'In 5 days': 5, 'In 6 days': 6}.get(states('input_select.kiln_firing_day'), 1) }}
      run_started: "{{ states('input_number.kiln_run_started_ts') | float(0) }}"
      running: "{{ d == 0 and is_state('sensor.kiln_state', 'RUNNING') and run_started > 0 }}"
      p: "{{ states('input_text.kiln_run_profile') if running else states('input_select.kiln_switch_schedule') }}"
